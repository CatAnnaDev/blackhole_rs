[package]
name = "blackhole_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.18.1"
bevy_egui = "0.39.1"
big_space = { version = "0.12.0", features = ["camera"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
